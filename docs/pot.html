<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loading leafy friend…</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
</head>
<body>

  <!-- BEAUTIFUL NEW HEADER -->
  <div class="pot-header">
    <a href="index.html" class="back-btn">← Garden Home</a>
    <div class="hero-photo" id="hero-photo"></div>
    <div class="pot-title-card">
      <h1 id="pot-name">Loading…</h1>
      <div class="species-badge" id="species-badge"></div>
      <div class="quick-facts" id="quick-facts"></div>
    </div>
  </div>

  <!-- PLANT CARD – now with Harvest Magic! -->
  <div class="plant-card">
    <div class="card-grid">
      <div><strong>Species</strong><br><span id="species-full"></span></span></div>
      <div><strong>Variety</strong><br><span id="variety"></span></div>
      <div><strong>Planted</strong><br><span id="planted-date"></span></div>
      <div><strong>Light</strong><br><span id="light-needs">☀️</span></div>
      <div><strong>Water</strong><br><span id="water-needs">💧</span></div>
      <div><strong>Common Pests</strong><br><span id="pests">—</span></div>
      <div><strong>Common Diseases</strong><br><span id="diseases">—</span></div>
      <div><strong>Notes</strong><br><span id="personality"></span></div>
      
      <!-- Best Planting Window -->
      <div style="grid-column: span 2; margin-top: 0.8rem; padding: 0.9rem; background: rgba(46,125,50,0.12); border-left: 4px solid #4CAF50; border-radius: 0 8px 8px 0;">
        <strong style="color: #2E7D32;">Best Planting Window (Central FL)</strong><br>
        <span id="planting-window" style="font-size: 1.1em; font-weight: bold; color: #1B5E20;"></span>
      </div>
      <div style="grid-column: span 2; padding: 0.6rem; background: rgba(76,175,80,0.08); border-radius: 8px;">
        <span id="planting-comments" style="font-style: italic; color: #33691E;"></span>
      </div>

      <!-- NEW: Harvest Countdown / Info -->
      <div id="harvest-section" style="display: none; grid-column: span 2; margin-top: 0.8rem; padding: 0.9rem; background: rgba(255,193,7,0.15); border-left: 4px solid #FFC107; border-radius: 0 8px 8px 0;">
        <strong style="color: #FF8F00;">🍅 Harvest Timeline</strong><br>
        <span id="harvest-info" style="font-size: 1.05em; color: #E65100;"></span>
      </div>

      <!-- Whimsy -->
      <div id="whimsy-container" style="grid-column: span 2; margin-top: 0.8rem; padding: 0.8rem; background: rgba(155,89,182,0.08); border-radius: 8px;">
        <strong style="color: #8e44ad;">✨ Secret Personality</strong><br>
        <span id="whimsy-text" style="font-style: italic; color: #6b46c1;"></span>
      </div>
    </div>
  </div>

  <!-- PHOTO DIARY -->
  <div class="container">
    <h2>📸 Photo Diary</h2>
    <div id="photo-gallery" class="gallery"></div>

    <h2>✍️ Garden Log</h2>
    <div id="pot-log" class="log"></div>
  </div>

  <script src="js/garden.js?v=3"></script>
  <script src="js/image-list.js"></script>
</body>
</html>
