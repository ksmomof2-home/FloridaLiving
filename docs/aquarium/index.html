<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble & Leaf • FloridaLiving Aquariums</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero">
        <div class="bubbles"></div>
        <h1>Bubble & Leaf</h1>
        <p class="tagline">The secret underwater gardens of FloridaLiving</p>
    </header>

    <nav class="fancy-nav">
        <a href="#tanks">The Tanks</a>
        <a href="#plants">The Green Wizards</a>
    </nav>

    <main id="app">
        <div class="loading">Summoning fish and bubbles… ✨</div>
    </main>

    <footer>
        <p>Hand-crafted with love & a few bubbles</p>
        <p>Sister site to our <a href="../garden/">Garden Diary</a></p>
    </footer>

    <script>
        fetch('data.json')               // ← data.json stays in /aquarium/ root (easy to edit)
            .then(r => r.json())
            .then(data => {
                const app = document.getElementById('app');
                app.innerHTML = '';

                // Tanks
                data.tanks.forEach(tank => {
                    const section = document.createElement('section');
                    section.className = 'tank-card';
                    section.innerHTML = `
                        <div class="tank-header ${tank.backgroundClass}">
                            <h2>${tank.name}</h2>
                            <p class="subtitle">${tank.subtitle}</p>
                        </div>
                        <div class="tank-content">
                            <img src="assets/${tank.photo}" alt="${tank.name}" class="tank-photo">
                            <div class="details">
                                <ul>
                                    <li><strong>Size:</strong> ${tank.size}</li>
                                    <li><strong>Substrate:</strong> ${tank.substrate}</li>
                                    <li><strong>Filtration:</strong> ${tank.filtration}</li>
                                    ${tank.heating ? `<li><strong>Heating:</strong> ${tank.heating}</li>` : ''}
                                    ${tank.decor ? `<li><strong>Décor:</strong> ${tank.decor}</li>` : ''}
                                    <li><strong>Current Citizens:</strong>
                                        <ul class="citizens">
                                            ${tank.inhabitants.map(i => `<li>${i.emoji} <strong>${i.count}</strong> ${i.name} ${i.note ? '— ' + i.note : ''}</li>`).join('')}
                                        </ul>
                                    </li>
                                </ul>
                            </div>
                        </div>`;
                    app.appendChild(section);
                });

                // Plants (photos now correctly under assets/img/)
                const plantsSec = document.createElement('section');
                plantsSec.className = 'plants';
                plantsSec.innerHTML = `
                    <h2 id="plants">The Green Wizards Keeping Everything Alive</h2>
                    <p>Both tanks share the same trio of botanical friends:</p>
                    <div class="plant-grid">
                        ${data.plants.map(p => `
                            <div class="plant">
                                <img src="assets/${p.photo}" alt="${p.name}">
                                <h3>${p.name}</h3>
                                <p>${p.description}</p>
                            </div>
                        `).join('')}
                    </div>`;
                app.appendChild(plantsSec);

                                // === Inhabitant Galleries ===
                const inhabitantsSec = document.createElement('section');
                inhabitantsSec.className = 'gallery';
                inhabitantsSec.innerHTML = `
                    <h2 id="inhabitants">Portraits of the Underwater Citizens</h2>
                    <p>A rogue's gallery of close-ups from the depths</p>
                    <div class="photo-grid">
                        ${data.inhabitantGalleries.map(g => `
                            <div class="species-card">
                                <h3>${g.species}</h3>
                                <p class="caption">${g.caption}</p>
                                <div class="species-photos">
                                    ${g.photos.map(p => `<img src="assets/${p}" alt="${g.species}" class="critter">`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                app.appendChild(inhabitantsSec);

                // === Decorations ===
                if (data.decorations && data.decorations.length > 0) {
                    const decorSec = document.createElement('section');
                    decorSec.className = 'gallery';
                    decorSec.innerHTML = `
                        <h2>Enchanted Accents</h2>
                        <p>Hidden nooks and charming hideaways</p>
                        <div class="photo-grid">
                            ${data.decorations.map(d => `
                                <div class="plant"> <!-- Reuse plant style for consistency -->
                                    <img src="assets/${d.photo}" alt="${d.name}">
                                    <h3>${d.name}</h3>
                                    <p>${d.caption}</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    app.appendChild(decorSec);
                }

                // === Tools ===
                if (data.tools && data.tools.length > 0) {
                    const toolsSec = document.createElement('section');
                    toolsSec.className = 'gallery';
                    toolsSec.innerHTML = `
                        <h2>Behind the Bubbles: The Wizard's Toolkit</h2>
                        <p>Artifacts that sustain the underwater magic</p>
                        <div class="photo-grid">
                            ${data.tools.map(t => `
                                <div class="plant">
                                    <img src="assets/${t.photo}" alt="${t.name}">
                                    <h3>${t.name}</h3>
                                    <p>${t.caption}</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    app.appendChild(toolsSec);
                }
            });
    </script>
</body>
</html>
